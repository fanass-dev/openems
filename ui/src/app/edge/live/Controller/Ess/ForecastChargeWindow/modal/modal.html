@if (isInitialized) {
  <oe-modal [title]="component.alias" [component]="component">
    <oe-modal-line [name]="'EDGE.INDEX.WIDGETS.FORECAST_CHARGE_WINDOW.PRICE' | translate"
      [value]="priceWithCurrency"></oe-modal-line>
    <oe-modal-line [name]="'GENERAL.STATUS' | translate" [value]="blockStatus"></oe-modal-line>
    <oe-modal-line [name]="'EDGE.INDEX.WIDGETS.FORECAST_CHARGE_WINDOW.LAST_DECISION' | translate"
      [value]="lastDecision" style="font-size: small;"></oe-modal-line>
    <oe-modal-horizontal-line></oe-modal-horizontal-line>
    <oe-modal-info-line
      [info]="'EDGE.INDEX.WIDGETS.FORECAST_CHARGE_WINDOW.CHART_TITLE' | translate"></oe-modal-info-line>
    <forecastChargeWindowPriceChart class="ion-padding" [component]="component" [edge]="edge">
    </forecastChargeWindowPriceChart>
  </oe-modal>
}
